<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Tutor</title>
<link rel="icon" type="image/gif" href="chatbot_favicon.gif">
<link rel="shortcut icon" href="chatbot_favicon.gif">
<link rel="apple-touch-icon" href="chatbot_favicon.gif">
<link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>New Chat</span>
            </button>
        </div>
        <div class="history-list" id="historyList">
            <!-- Chat sessions will be injected here -->
        </div>
        <div class="sidebar-footer">
            <button class="clear-all-btn" id="clearAllBtn">
                <svg viewBox="0 0 24 24"><path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13zM9 8h2v9H9V8zm4 0h2v9h-2V8z"/></svg>
                Clear All
            </button>
        </div>
    </aside>

    <div id="app">
        <div class="stars" id="stars"></div>

        <header class="header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn">
                    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="ai-badge">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </div>
                <div>
                    <div class="header-title">Socrates</div>
                    <div class="header-sub">
                        <span class="dot-online"></span>
                        Online
                    </div>
                </div>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </div>
                <div class="welcome-title">Hello, Coder! 👋</div>
                <div class="welcome-sub">How can I help you with code today?</div>

                <div class="suggestions">
                    <div class="suggestion-card">
                        <div class="s-icon">
                            <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                        </div>
                        <div class="s-title">Explain Code</div>
                        <div class="s-sub">Line-by-line breakdown of any snippet</div>
                    </div>

                    <div class="suggestion-card">
                        <div class="s-icon">
                            <svg viewBox="0 0 24 24"><path d="M20 8h-2.81a5.985 5.985 0 00-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C13 5.06 12.51 5 12 5c-.51 0-1 .06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/></svg>
                        </div>
                        <div class="s-title">Debug Error</div>
                        <div class="s-sub">Find and fix bugs instantly</div>
                    </div>

                    <div class="suggestion-card">
                        <div class="s-icon">
                            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
                        </div>
                        <div class="s-title">Optimize Code</div>
                        <div class="s-sub">Improve performance and quality</div>
                    </div>

                    <div class="suggestion-card">
                        <div class="s-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18V15c0 3.31 3.13 6 7 6s7-2.69 7-6v-3.82L20 9v6h2V9L12 3zm5 9.99l-5 2.73-5-2.73v-2.91L12 12l5-1.92v1.91z"/></svg>
                        </div>
                        <div class="s-title">Learn Concept</div>
                        <div class="s-sub">Understand programming ideas</div>
                    </div>
                </div>
            </div>

            <div id="chatMessages" class="chat-messages" style="display: none;"></div>
        </div>

        <div id="fileIndicator" class="file-indicator">
            <span id="fileName"></span>
            <button id="removeFileBtn">✕</button>
        </div>

        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*,.txt,.js,.html,.css,.py,.json" style="display: none;" />
            
            <div class="attach-btn" id="attachBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 015 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 005 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                </svg>
            </div>

            <div class="input-wrap">
                <textarea id="msgInput" rows="1" placeholder="Ask anything or paste code..."></textarea>
            </div>

            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
</div>

<script src="script.js"></script>
</body>
</html>
